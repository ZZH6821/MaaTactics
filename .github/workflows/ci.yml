name: CI
on:
  push:
  pull_request:
jobs:
  mock-and-protocol:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run ruff check src tests tools
      - run: uv run ruff format --check src tests tools
      - run: uv run pytest -m 'not native and not device'
